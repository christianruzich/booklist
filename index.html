<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Book List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one left-aligned ledger column like the Doc List. Each book is a tappable row; status and rating sit at the right edge. */
:root {
  --bg: #EFEFF2;
  --surface: #F8F8FA;
  --fg: #16151A;
  --muted: #5F5C68;
  --line: #CFCDD6;
  --accent: #8A2D3B;
  --accent-fg: #FFFFFF;
  --star: #B9770E;
  --star-off: #C9C7D0;
  --chip: #E3E2E9;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131217; --surface: #1B1A21; --fg: #E8E6EE; --muted: #9B97A7; --line: #2D2B36;
    --accent: #E8909D; --accent-fg: #1E0B10; --star: #E9AE4A; --star-off: #3C3A47; --chip: #25232D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131217; --surface: #1B1A21; --fg: #E8E6EE; --muted: #9B97A7; --line: #2D2B36;
  --accent: #E8909D; --accent-fg: #1E0B10; --star: #E9AE4A; --star-off: #3C3A47; --chip: #25232D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-block: 2rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 52rem; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kicker { font: 500 .75rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 .75rem; }
h1 { font: 800 clamp(2.1rem, 7vw, 3.4rem)/1 var(--f-display); letter-spacing: -.02em; margin: 0 0 .75rem; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 40rem; }
.controls { display: grid; gap: .9rem; margin-block: 1.75rem 1rem; }
.field { display: grid; gap: .3rem; min-width: 0; }
.field > span { font: 500 .7rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input[type="search"], select {
  width: 100%; min-height: 44px; min-width: 0;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px;
  padding: .55rem .7rem; font: inherit;
}
.selects { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip {
  font: 500 .8rem/1 var(--f-mono); min-height: 40px; padding: 0 .85rem;
  background: var(--chip); color: var(--fg); border: 1px solid transparent; border-radius: 4px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chip .n { opacity: .7; margin-left: .35rem; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; }
.count { font: 500 .85rem/1 var(--f-mono); color: var(--muted); margin: 0; }
.reset { font: 500 .85rem var(--f-body); color: var(--accent); background: none; border: 0; padding: .5rem 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.list { list-style: none; margin: .5rem 0 0; padding: 0; border-bottom: 1px solid var(--line); }
.list li { border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .35rem 1rem; align-items: start;
  width: 100%; padding: .95rem .5rem; text-align: left;
  background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
}
.row:hover { background: var(--surface); }
.title { font: 700 1.1rem/1.25 var(--f-display); text-wrap: balance; overflow-wrap: anywhere; }
.by { font: 400 .8rem/1.4 var(--f-mono); color: var(--muted); margin-top: .2rem; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
.tag { font: 500 .7rem/1 var(--f-mono); letter-spacing: .04em; padding: .3rem .45rem; background: var(--chip); border-radius: 3px; color: var(--fg); }
.tag.prio { background: var(--accent); color: var(--accent-fg); }
.check { display: inline-flex; align-items: center; gap: .6rem; min-height: 44px; cursor: pointer; font-weight: 500; }
.check input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); margin: 0; }
.check .n { font: 500 .8rem/1 var(--f-mono); color: var(--muted); }
.tag.note { background: transparent; box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.state { display: grid; gap: .4rem; justify-items: end; text-align: right; }
.lab { font: 500 .62rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lab.on { color: var(--accent); }
.rt { display: flex; align-items: center; gap: .5rem; justify-content: flex-end; }
.num { font: 500 1.05rem/1 var(--f-mono); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.stars { position: relative; display: inline-block; font-size: .85rem; line-height: 1; white-space: nowrap; color: var(--star-off); }
.stars::before { content: "\2605\2605\2605\2605\2605"; }
.stars > i { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); overflow: hidden; color: var(--star); font-style: normal; }
.stars > i::before { content: "\2605\2605\2605\2605\2605"; }
.empty { padding: 2rem .5rem; color: var(--muted); }
.start { display: grid; gap: 1rem; justify-items: start; padding: 2rem .5rem; border-top: 1px solid var(--line); margin-top: 1rem; }
.hint { margin: 0; color: var(--muted); max-width: 40ch; }
.showall { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.1rem; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
.foot { font: italic 400 .8rem/1.4 var(--f-body); color: var(--muted); margin: 1.5rem .5rem 0; text-align: center; }
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 8, 12, .55); }
.panel {
  width: 100%; max-width: 36rem; max-height: 88%; overflow: auto;
  background: var(--surface); color: var(--fg);
  border-radius: 12px 12px 0 0; border: 1px solid var(--line);
  padding-top: 1.25rem;
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 640px) {
  .sheet { align-items: center; padding: 1.5rem; }
  .panel { border-radius: 12px; padding-inline: 1.75rem; padding-bottom: 1.75rem; }
}
.p-head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
.p-title { font: 800 1.6rem/1.1 var(--f-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.close { flex: none; min-height: 40px; padding: 0 .8rem; background: var(--chip); color: var(--fg); border: 0; border-radius: 6px; font: 500 .85rem var(--f-body); cursor: pointer; }
.p-rate { display: flex; align-items: center; gap: .75rem; margin-block: 1.1rem 0; }
.p-rate .num { font-size: 1.5rem; }
.p-rate .stars { font-size: 1.05rem; }
.p-meta { margin: 1.1rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem; }
.p-meta dt { font: 500 .7rem/1.9 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.p-meta dd { margin: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .row, .chip { transition: background .12s ease; } }

/* In-page editing */
.wrap { padding-bottom: 4.5rem; }
.fab {
  position: fixed; z-index: 10; width: 56px; height: 56px; border-radius: 50%; border: 0;
  right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-fg); font: 400 32px/1 var(--f-body); cursor: pointer;
  display: grid; place-items: center; padding: 0 0 3px; box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
}
.acts { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }
.ebtn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 1.1rem;
  border: 0; border-radius: 6px; font: 600 1rem var(--f-body); cursor: pointer;
  background: var(--chip); color: var(--fg);
}
.ebtn.pri { background: var(--accent); color: var(--accent-fg); }
.ebtn.danger { color: #B3261E; }
.ebtn.armed { background: #B3261E; color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ebtn.danger { color: #F2877F; } }
:root[data-theme="dark"] .ebtn.danger { color: #F2877F; }
.form { display: grid; gap: .9rem; margin-top: 1rem; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.form input[type="text"], .form input[type="number"], .form input[type="url"], .form input[type="password"], .form select, .form textarea {
  width: 100%; min-height: 44px; min-width: 0; background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: .55rem .7rem; font: inherit;
}
.form textarea { min-height: 5.5rem; resize: vertical; }
.fcheck { display: flex; align-items: center; gap: .6rem; min-height: 44px; font-weight: 500; cursor: pointer; }
.fcheck input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); margin: 0; flex: none; }
.fhint { font: 400 .78rem/1.35 var(--f-mono); color: var(--muted); margin: 0; }
.chips.small .chip { min-height: 34px; padding: 0 .65rem; font-size: .75rem; }
.ferr { margin: 0; color: #B3261E; font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ferr { color: #F2877F; } }
:root[data-theme="dark"] .ferr { color: #F2877F; }
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(90px + env(safe-area-inset-bottom, 0px)); max-width: min(90vw, 28rem);
  background: var(--fg); color: var(--bg); padding: .65rem 1rem; border-radius: 8px;
  font: 500 .9rem/1.3 var(--f-body); box-shadow: 0 6px 18px rgba(0, 0, 0, .3); text-align: center;
}
.p-desc { margin: 1.1rem 0 0; max-width: 60ch; white-space: pre-line; }
.p-src { margin: .5rem 0 0; font: 400 .8rem/1.4 var(--f-mono); color: var(--muted); }
.p-src a { color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.1rem; background: var(--accent); color: var(--accent-fg); border-radius: 6px; font-weight: 600; text-decoration: none; }
.p-copy { margin: 1rem 0 0; color: var(--muted); max-width: 60ch; }
.syncbar {
  position: fixed; z-index: 40; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: .6rem 1rem; padding: .7rem max(16px, env(safe-area-inset-right, 0px)) .7rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); color: var(--fg); border-bottom: 2px solid var(--accent); font-weight: 500;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
}
.syncbar .sbtns { display: flex; flex-wrap: wrap; gap: .5rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Reading log</p>
    <h1>The Book List</h1>
    <p class="sub">Books I have read, am reading, plan to read, or put down. Tap a title for details.</p>
  </header>

  <section class="controls" aria-label="Filters">
    <label class="field"><span>Search</span><input id="q" type="search" placeholder="Title, author, or genre" autocomplete="off"></label>
    <div class="field"><span>Show</span><div class="chips" id="status" role="group" aria-label="Show"></div></div>
    <label class="check" for="prio"><input type="checkbox" id="prio"><span>Priority only</span><span class="n" id="prion"></span></label>
    <div class="chips" id="gsel" aria-label="Selected genres" hidden></div>
    <div class="selects">
      <label class="field"><span>Genre (pick one or more)</span><select id="genre"></select></label>
      <label class="field"><span>Sort</span>
        <select id="sort">
          <option value="list">My list order</option>
          <option value="genre">Genre, A to Z</option>
          <option value="added">By date added, newest first</option>
          <option value="mine">My rating, high to low</option>
          <option value="title">Title, A to Z</option>
          <option value="author">Author, A to Z</option>
        </select>
      </label>
      <label class="field"><span>My rating</span>
        <select id="minr">
          <option value="0">Any</option><option value="3">3.0 and up</option><option value="3.5">3.5 and up</option>
          <option value="4">4.0 and up</option><option value="4.5">4.5 and up</option>
        </select>
      </label>
    </div>
  </section>

  <div class="bar" id="bar" hidden>
    <p class="count" id="count" aria-live="polite"></p>
    <button class="reset" id="reset" type="button">Clear filters</button>
  </div>

  <div class="start" id="start">
    <p class="hint">Search by title, author, or genre, or pick a filter, to see books.</p>
    <button class="showall" id="showall" type="button">Show all books</button>
  </div>

  <ol class="list" id="list" hidden></ol>
  <p class="empty" id="empty" hidden>No books match those filters.</p>
  <p class="foot"><button class="reset" id="owner" type="button">Owner sign-in</button></p>
  <p class="foot">Vibecoded with Claude</p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" id="panel"></div>
</div>
<button class="fab" id="fab" type="button" aria-label="Add a book" hidden>+</button>
<div class="syncbar" id="syncbar" role="status" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>

   Everyone reads data.json from this site. Only someone holding a GitHub token that can write to
   this repo can save changes; each save is a commit to data.json. */

function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function isOwner() { return !!getToken(); }
function toast(m) {
  var t = gid("toast"); t.textContent = m; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4000);
}
function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ Accept: "application/vnd.github+json" }, opt.headers || {});
  var t = getToken(); if (t) opt.headers.Authorization = "Bearer " + t;
  return fetch("https://api.github.com" + path, opt);
}
function b64enc(s) {
  var b = new TextEncoder().encode(s), bin = "";
  for (var i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(s) {
  var bin = atob(s.replace(/\s/g, "")), b = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);

function fileUrl() { return "/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path; }
function parseData(text) { var d = JSON.parse(text); return cleanList(Array.isArray(d) ? d : d[LIST_KEY]); }
function cacheIt(c) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) {} }

/* Owner: read through the GitHub API (always fresh, and gives the sha needed to save).
   Everyone else: read data.json from the site. Fallbacks: last copy cached in this browser, then the list built into the page. */
async function loadData() {
  GH.sha = null;
  if (isOwner()) {
    try {
      var r = await api(fileUrl());
      if (r.status === 200) {
        var j = await r.json(); GH.sha = j.sha;
        var c = parseData(b64dec(j.content)); if (c) { cacheIt(c); return c; }
      } else if (r.status === 404) { return seedList(); }
      else if (r.status === 401) { toast("GitHub rejected your token. Use Owner tools to sign in again."); }
    } catch (e) {}
  }
  try {
    var r2 = await fetch("data.json", { cache: "no-cache" });
    if (r2.ok) { var c2 = parseData(await r2.text()); if (c2) { cacheIt(c2); return c2; } }
  } catch (e) {}
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (raw) { var c3 = cleanList(JSON.parse(raw)); if (c3) return c3; }
  } catch (e) {}
  return seedList();
}

function publish(msg) {
  if (!isOwner()) return Promise.resolve(false);
  if (msg) pendingMsg = msg;
  chain = chain.then(doPublish);
  return chain;
}
async function doPublish() {
  var text = serialize();
  if (text === lastSer) return true;
  var body = { message: pendingMsg || "Update " + GH.path, content: b64enc(text) };
  if (GH.sha) body.sha = GH.sha;
  try {
    var r = await api(fileUrl(), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok) {
      var j = await r.json(); GH.sha = j.content.sha; lastSer = text; cacheIt(getList());
      showBar(null); toast("Saved to GitHub. It goes live in about a minute.");
      return true;
    }
    if (r.status === 409 || r.status === 422) showSync("conflict");
    else if (r.status === 401) showSync("auth");
    else if (r.status === 403 || r.status === 404) showSync("denied");
    else showSync("error", r.status);
  } catch (e) { showSync("offline"); }
  return false;
}

/* ---- status bar ---- */
function showBar(html) {

}
function showSync(kind, code) {
  var msg = {
    conflict: "This list changed somewhere else (another device?). Reload to get the latest, then redo your last edit.",
    auth: "GitHub rejected your token. It may have expired or been revoked.",
    denied: "GitHub won't let this token write to " + GH.repo + ". It needs Contents: Read and write on that repository.",
    offline: "Couldn't reach GitHub, so your last change isn't saved yet.",
    error: "GitHub returned an error (" + code +"), so your last change isn't saved yet."
  }[kind];
  var main = kind === "conflict" ? '<button type="button" class="ebtn pri" data-sync="reload">Reload</button>'
    : kind === "auth" || kind === "denied" ? '<button type="button" class="ebtn pri" data-sync="signin">Sign in again</button>'
    : '<button type="button" class="ebtn pri" data-sync="retry">Retry</button>';
  showBar('<span>' + msg + '</span><span class="sbtns">' + main + '<button type="button" class="ebtn" data-sync="dismiss">Dismiss</button></span>');
}

  if (!tok) return fail("Paste your token first.");
  try {
    var r = await fetch("https://api.github.com/repos/" + GH.owner + "/" + GH.repo, { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + tok } });
    if (r.status === 401) return fail("GitHub rejected that token.");
    if (r.status === 404) return fail("That token can't see " + GH.owner + "/" + GH.repo + ". When you create it, give it access to this repository.");
    if (!r.ok) return fail("GitHub returned " + r.status + ".");
    var j = await r.json();
    if (j.permissions && j.permissions.push === false) return fail("That token is read-only. It needs Contents: Read and write.");
  } catch (e) { return fail("Couldn't reach GitHub."); }
  try { localStorage.setItem(TOKEN_KEY, tok); } catch (e) { return fail("This browser wouldn't store the token."); }

  loadData().then(function (c) { setList(c); lastSer = serialize(); refreshAll(); toast("Signed out."); });
}

/* Edits saved in this browser by the earlier browser-only version of this page. */
function checkLegacy() {
  if (!isOwner()) return;
  var raw; try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { return; }
  if (!raw) return;
  var c; try { c = cleanList(JSON.parse(raw)); } catch (e) { c = null; }
  var drop = function () { try { localStorage.removeItem(LEGACY_KEY); } catch (e) {} };
  if (!c || JSON.stringify(c) === JSON.stringify(getList())) { drop(); return; }
  legacyData = c;
  showBar('<span>This browser holds ' + c.length + ' entries saved by the earlier version (GitHub has ' + getList().length + '). Publish them, replacing the list on GitHub?</span>' +
    '<span class="sbtns"><button type="button" class="ebtn pri" data-sync="legacy-pub">Publish them</button>' +
    '<button type="button" class="ebtn" data-sync="legacy-drop">Discard</button><button type="button" class="ebtn" data-sync="dismiss">Later</button></span>');
}

function bindOwner() {
  gid("owner").addEventListener("click", function () { lastFocus = gid("owner"); if (isOwner()) openOwner(); else openSignin(); });
  gid("syncbar").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sync]"); if (!b) return;
    var a = b.getAttribute("data-sync");
    if (a === "dismiss") showBar(null);
    else if (a === "reload") reloadFromGitHub();
    else if (a === "retry") { showBar(null); toast("Saving…"); publish(); }
    else if (a === "signin") { showBar(null); openSignin(); }
    else if (a === "legacy-pub") {
      closeSheet(); setList(legacyData); refreshAll(); showBar(null); toast("Saving…");
      publish("Publish edits saved in this browser").then(function (ok) { if (ok) { try { localStorage.removeItem(LEGACY_KEY); } catch (e) {} } });
    } else if (a === "legacy-drop") { try { localStorage.removeItem(LEGACY_KEY); } catch (e) {} showBar(null); }
  });
  gid("panel").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act");
    if (a === "export") exportData();
    else if (a === "signout") signOut();

  });
  gid("panel").addEventListener("submit", function (e) { if (e.target.id === "tf") { e.preventDefault(); signIn(); } });
  gid("panel").addEventListener("change", function (e) { if (e.target.id === "imp") importFile(e.target.files[0]); });
  gid("fab").addEventListener("click", function () { lastFocus = gid("fab"); openEdit(-1); });
}


function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function stars(r){ return '<span class="stars" aria-hidden="true"><i style="--p:'+(r/5*100)+'%"></i></span>'; }
function fmtDate(d){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return d; return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }
function lastName(a){ var f=a.split(",")[0].trim().split(/\s+/); return (f[f.length-1]||"").toLowerCase(); }
function sortTitle(t){ return t.toLowerCase().replace(/^(the|a|an)\s+/,""); }

/* ---- Online lookups. Descriptions come from Open Library, with Wikipedia as a fallback (both free, no key). The lookup runs in the
   owner's browser only when a book is added or when "Find description" is tapped, and the text is saved
   with the book, so visitors never trigger it. A failed lookup never blocks saving. ---- */
var OL = "https://openlibrary.org";
function olJson(url){
  var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, 10000);
  return fetch(url, { signal: c.signal })
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; })
    .then(function(j){ clearTimeout(t); return j; });
}
function okSrc(u){ return /^https:\/\/(openlibrary\.org|en\.wikipedia\.org)\//.test(u); }
function srcLabel(u){ return u.indexOf("https://en.wikipedia.org/")===0 ? "Wikipedia (CC BY-SA)" : "Open Library"; }
function srcName(u){ return u.indexOf("https://en.wikipedia.org/")===0 ? "Wikipedia" : "Open Library"; }
/* Fallback: Wikipedia intro text, accepted only when the article mentions the author's last name */
async function wikiLookup(title, author){
  var main=mainTitle(title), first=(author||"").split(",")[0].trim(), ln=lastName(author||"");
  if(!ln) return {none:true};
  var url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=5"+
    "&gsrsearch="+encodeURIComponent(main+" "+first+" book")+"&prop=extracts|info&exintro=1&explaintext=1&exlimit=5&inprop=url";
  var data=await olJson(url);
  if(!data) return {error:true};
  var pages=data.query && data.query.pages ? Object.keys(data.query.pages).map(function(k){ return data.query.pages[k]; }) : [];
  pages.sort(function(a,b){ return (a.index||0)-(b.index||0); });
  for(var i=0;i<pages.length;i++){
    var pg=pages[i], ex=pg.extract||"";
    if(!ex || /may refer to:?\s*$/m.test(ex.slice(0,300)) || /\(disambiguation\)/i.test(pg.title)) continue;
    if(ex.toLowerCase().indexOf(ln)<0) continue;
    if(normT(pg.title).indexOf(normT(main))<0) continue;
    var d=cleanDesc(ex);
    if(d && pg.fullurl && /^https:\/\/en\.wikipedia\.org\//.test(pg.fullurl)) return {desc:d, src:pg.fullurl};
  }
  return {none:true};
}
function mainTitle(t){ var m=t.split(":")[0].trim(); return m.length<4 ? t : m; }
function normT(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function cleanDesc(d){
  if(d && typeof d==="object") d=d.value;
  if(typeof d!=="string") return "";
  d=d.split(/\r?\n-{5,}/)[0];
  d=d.replace(/\s*\(\s*\[[^\]]*\]\s*(?:\[\d*\]|\([^)]*\))\s*\)/g,"");
  d=d.replace(/\[([^\]]+)\]\(([^)]*)\)/g,"$1").replace(/\[([^\]]+)\]\[\d*\]/g,"$1").replace(/^\s*\[\d+\]:.*$/gm,"");
  d=d.replace(/\*\*|__/g,"").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  if(d.length>1200) d=d.slice(0,1200).replace(/\s+\S*$/,"")+"…";
  return d;
}
/* resolves to {desc, src}, {none:true} (no confident match or no description) or {error:true} (could not reach Open Library) */
async function olLookup(title, author){
  var main=mainTitle(title), first=(author||"").split(",")[0].trim(), ln=lastName(author||"");
  var tries=[{title:main, author:first}, {q:(main+" "+first).trim()}];
  var reached=false;
  for(var i=0;i<tries.length;i++){
    var p=tries[i]; if(i===0 && !first) delete p.author;
    p.limit=5; p.fields="key,title,author_name";
    var q=Object.keys(p).map(function(k){ return k+"="+encodeURIComponent(p[k]); }).join("&");
    var data=await olJson(OL+"/search.json?"+q);
    if(!data) continue;
    reached=true;
    var docs=data.docs||[], hit=null;
    for(var j=0;j<docs.length && !hit;j++){
      var names=(docs[j].author_name||[]).join(" ").toLowerCase();
      if(ln ? names.indexOf(ln)>=0 : normT(docs[j].title||"")===normT(main)) hit=docs[j];
    }
    if(!hit || !hit.key) continue;
    var work=await olJson(OL+hit.key+".json");
    if(!work) continue;
    var d=cleanDesc(work.description);
    if(d) return {desc:d, src:OL+hit.key};
  }
  return reached ? {none:true} : {error:true};
}
async function lookupDescription(title, author){
  var r=await olLookup(title, author);
  if(r.desc) return r;
  var w=await wikiLookup(title, author);
  if(w.desc) return w;
  return (r.error && w.error) ? {error:true} : {none:true};
}
async function enrich(b){
  var res=await lookupDescription(b.t, b.a);
  var i=BOOKS.indexOf(b);
  if(i<0) i=BOOKS.findIndex(function(x){ return x.t===b.t && x.a===b.a; });
  if(i<0) return;
  if(res.desc){
    BOOKS[i].desc=res.desc; BOOKS[i].src=res.src;
    if(!$("sheet").hidden && !editing && cur===i) openSheet(i);
    toast("Description added."); publish("Add description: "+BOOKS[i].t);
  } else if(res.error) toast("Couldn't reach Open Library or Wikipedia. You can add a description by editing the book.");
  else toast("No description found. You can add one by editing the book.");
}
function bookshopUrl(b){
  return "https://bookshop.org/search?keywords="+encodeURIComponent(mainTitle(b.t)+" "+(b.a||"").split(",")[0].trim());
}

function buildControls(){
  var counts={all:BOOKS.length};
  BOOKS.forEach(function(b){ counts[b.s]=(counts[b.s]||0)+1; });
  $("prion").textContent = "("+BOOKS.filter(function(b){ return b.p; }).length+")";
  $("status").innerHTML = STATUS.map(function(s){
    return '<button class="chip" type="button" data-s="'+s[0]+'" aria-pressed="'+(st.status===s[0])+'">'+s[1]+'<span class="n">'+(counts[s[0]]||0)+'</span></button>';
  }).join("");
  buildGenre();
}

function buildGenre(){
  var gc={};
  BOOKS.forEach(function(b){ b.g.forEach(function(g){ gc[g]=(gc[g]||0)+1; }); });
  var left=Object.keys(gc).sort().filter(function(g){ return st.genres.indexOf(g)<0; });
  $("genre").innerHTML = '<option value="">'+(st.genres.length?'Add another genre':'Any genre')+'</option>' + left.map(function(g){ return '<option value="'+esc(g)+'">'+esc(g)+' ('+gc[g]+')</option>'; }).join("");
  $("genre").value="";
  $("gsel").hidden = !st.genres.length;
  $("gsel").innerHTML = st.genres.map(function(g){ return '<button class="chip" type="button" aria-pressed="true" data-g="'+esc(g)+'" aria-label="Remove genre '+esc(g)+'">'+esc(g)+' ×</button>'; }).join("");
}

function filtered(){
  var q=st.q.trim().toLowerCase();
  var out=BOOKS.filter(function(b){
    if(st.status!=="all" && b.s!==st.status) return false;
    if(st.genres.length && !st.genres.some(function(g){ return b.g.indexOf(g)>=0; })) return false;
    if(st.prio && !b.p) return false;
    if(st.minr>0 && !(b.r!==null && b.r>=st.minr)) return false;
    if(q){ var hay=(b.t+" "+b.a+" "+b.g.join(" ")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  var cmp={
    list:function(a,b){ return a.i-b.i; },
    genre:function(a,b){
      var x=a.g[0]||"~", y=b.g[0]||"~";
      return x.localeCompare(y) || a.i-b.i;
    },
    added:function(a,b){
      if(a.d&&b.d) return a.d<b.d?1:a.d>b.d?-1:b.i-a.i;
      if(a.d) return -1; if(b.d) return 1;
      return a.i-b.i;
    },
    mine:function(a,b){ var x=a.r===null?-1:a.r, y=b.r===null?-1:b.r; return y-x || a.i-b.i; },
    title:function(a,b){ return sortTitle(a.t).localeCompare(sortTitle(b.t)); },
    author:function(a,b){ return lastName(a.a).localeCompare(lastName(b.a)) || sortTitle(a.t).localeCompare(sortTitle(b.t)); }
  }[st.sort];
  return out.sort(cmp);
}

function isActive(){
  return st.all || st.q.trim()!=="" || st.status!=="all" || st.genres.length>0 || st.prio || st.minr>0;
}
function render(){
  var active=isActive();
  $("start").hidden=active; $("bar").hidden=!active; $("list").hidden=!active;
  Array.prototype.forEach.call($("status").children,function(c){ c.setAttribute("aria-pressed", String(c.getAttribute("data-s")===st.status)); });
  if(!active){ $("list").innerHTML=""; $("empty").hidden=true; return; }
  var items=filtered();
  $("list").innerHTML = items.map(function(b){
    var tags=(b.p?'<span class="tag prio">Priority</span>':'')+b.g.map(function(g){ return '<span class="tag">'+esc(g)+'</span>'; }).join("");
    var right='<span class="lab'+(b.s==="reading"?' on':'')+'">'+LABEL[b.s]+'</span>';
    if(b.r!==null) right+='<span class="rt">'+stars(b.r)+'<span class="num">'+b.r.toFixed(1)+'</span></span>';
    return '<li><button class="row" type="button" data-i="'+b.i+'"><span><span class="title">'+esc(b.t)+'</span><span class="by" style="display:block">'+esc(b.a)+'</span><span class="tags">'+tags+'</span></span><span class="state">'+right+'</span></button></li>';
  }).join("");
  $("empty").hidden = items.length>0;
  $("count").textContent = items.length+" of "+BOOKS.length+" books";
  Array.prototype.forEach.call($("status").children,function(c){ c.setAttribute("aria-pressed", String(c.getAttribute("data-s")===st.status)); });
}

function openSheet(i){
  var b=BOOKS[i]; cur=i; editing=false;
  var h='<div class="p-head"><h2 class="p-title" id="p-title">'+esc(b.t)+'</h2><button class="close" type="button" data-act="close">Close</button></div>';
  if(b.r!==null) h+='<div class="p-rate">'+stars(b.r)+'<span class="num">'+b.r.toFixed(1)+'</span></div>';
  h+='<dl class="p-meta"><dt>Author</dt><dd>'+esc(b.a)+'</dd><dt>Status</dt><dd>'+LABEL[b.s]+'</dd>';

  if(b.d) h+='<dt>Added</dt><dd>'+esc(fmtDate(b.d))+'</dd>';
  if(b.n) h+='<dt>Note</dt><dd>'+esc(b.n)+'</dd>';
  h+='</dl>';
  if(b.desc){
    h+='<p class="p-desc">'+esc(b.desc)+'</p>';

  }

function closeSheet(){ $("sheet").hidden=true; editing=false; if(lastFocus&&lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} } }

/* ---- editing ---- */
function fv(x){ return x===undefined||x===null ? "" : esc(x); }

function openEdit(i){
  var b = i>=0 ? BOOKS[i] : {g:[], s:"toread"};
  cur=i; editing=true;
  var gc={};
  BOOKS.forEach(function(x){ x.g.forEach(function(g){ gc[g]=(gc[g]||0)+1; }); });

  var chips=names.map(function(g){

  }).join("");

    '<form class="form" id="ef" novalidate>'+

    '</div>'+
    '<label class="field"><span>Genres</span><input type="text" id="f-g" value="'+fv(b.g.join(", "))+'" autocomplete="off"></label>'+

  $("sheet").hidden=false;

function toggleGenre(v){
  var inp=$("f-g");
  var list=inp.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean);
  var at=list.indexOf(v);
  if(at>=0) list.splice(at,1); else list.push(v);
  inp.value=list.join(", ");
  var now=inp.value.split(",").map(function(x){ return x.trim(); });
  Array.prototype.forEach.call(document.querySelectorAll("#f-chips .chip"),function(c){
    c.setAttribute("aria-pressed", now.indexOf(c.getAttribute("data-v"))>=0?"true":"false");
  });
}

function readForm(base){
  var g=function(id){ return $(id).value.trim(); };
  var t=g("f-t");
  if(!t) return {err:"Title is required."};
  var rv=g("f-r"), r=null;
  if(rv!==""){ r=parseFloat(rv); if(!(r>=0.5 && r<=5)) return {err:"My rating must be between 0.5 and 5."}; }
  var gs=[];
  g("f-g").split(",").forEach(function(x){ x=x.trim(); if(x && gs.indexOf(x)<0) gs.push(x); });
  var o={t:t, a:g("f-a"), g:gs, r:r, n:g("f-n"), s:$("f-s").value};
  if($("f-p").checked) o.p=1;
  var dtxt=g("f-d");
  if(dtxt){ o.desc=dtxt; var dsrc=$("f-d").getAttribute("data-src"); if(dsrc && okSrc(dsrc)) o.src=dsrc; }
  if(base && base.d) o.d=base.d; else if(!base) o.d=today();
  return {b:o};
}

function saveForm(){
  var base = cur>=0 ? BOOKS[cur] : null;
  var r=readForm(base);
  if(r.err){ var el=$("ferr"); el.textContent=r.err; el.hidden=false; return; }
  var idx;
  if(base){ BOOKS[cur]=r.b; idx=cur; } else { BOOKS.push(r.b); idx=BOOKS.length-1; }
  reindex();
  buildControls(); render(); openSheet(idx);
  toast("Saving…"); publish((base?"Edit book: ":"Add book: ")+r.b.t);
  if(!base && !r.b.desc) enrich(r.b);
}

async function findIntoForm(){
  var t=$("f-t").value.trim(), a=$("f-a").value.trim(), h=$("f-dh");
  if(!t){ h.textContent="Enter a title first."; return; }
  h.textContent="Looking up…";
  var res=await lookupDescription(t,a);
  if(!$("f-d")) return;
  if(res.desc){ $("f-d").value=res.desc; $("f-d").setAttribute("data-src",res.src); h.textContent="Found on "+srcName(res.src)+". Check it matches the book, then Save."; }
  else if(res.error) h.textContent="Couldn't reach Open Library or Wikipedia. Try again, or type a description.";
  else h.textContent="No description found for that title and author.";
}

function deleteBook(i){
  var t=BOOKS[i].t;
  BOOKS.splice(i,1); reindex();
  buildControls(); render(); closeSheet();
  toast("Saving…"); publish("Delete book: "+t);
}

function onPanelClick(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act");
  if(a==="close") closeSheet();
  else if(a==="edit") openEdit(cur);
  else if(a==="cancel"){ if(cur>=0) openSheet(cur); else closeSheet(); }
  else if(a==="gen") toggleGenre(b.getAttribute("data-v"));
  else if(a==="find") findIntoForm();
  else if(a==="del"){
    if(!b.getAttribute("data-armed")){
      b.setAttribute("data-armed","1"); b.classList.add("armed");
      var label=b.textContent; b.textContent="Tap again to confirm";
      setTimeout(function(){
        if(b.isConnected){ b.removeAttribute("data-armed"); b.classList.remove("armed"); b.textContent=label; }
      },4000);
    } else deleteBook(cur);
  }
}
